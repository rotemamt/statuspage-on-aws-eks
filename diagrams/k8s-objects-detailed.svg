<text class="ts" x="152" y="344">:6379</text>
<line class="arr" x1="235" y1="378" x2="240" y2="378" marker-end="url(#arrow)" stroke="#534AB7"/>
<text class="ts" x="245" y="336" text-anchor="middle">rq / scheduler use redis</text>
<line class="arr" x1="250" y1="372" x2="238" y2="372" marker-end="url(#arrow)" stroke="#534AB7"/>
<line class="arr" x1="145" y1="331" x2="235" y2="608" marker-end="url(#arrow)" stroke="#534AB7" stroke-dasharray="3 2"/>
<text class="ts" x="120" y="560" text-anchor="end">web → RDS :5432</text>

<g><rect x="490" y="30" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/><text class="ts" x="506" y="39">workload</text>
<rect x="490" y="48" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/><text class="ts" x="506" y="57">data</text>
<rect x="575" y="30" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/><text class="ts" x="591" y="39">config</text>

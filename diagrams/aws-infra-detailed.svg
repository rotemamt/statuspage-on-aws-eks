<g class="c-gray"><rect x="440" y="570" width="92" height="46" rx="4"/><text class="ts" x="486" y="597" text-anchor="middle">CloudWatch</text></g>
<g class="c-gray"><rect x="540" y="570" width="92" height="46" rx="4"/><text class="ts" x="586" y="591" text-anchor="middle">IAM roles</text><text class="ts" x="586" y="606" text-anchor="middle">+ OIDC</text></g>


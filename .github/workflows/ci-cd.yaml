name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ro-ro-statuspage-dev-repo
  EKS_CLUSTER: ro-ro-statuspage-cluster
  AWS_ACCOUNT_ID: "992382545251"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/statuspage

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Security scan — infra (Terraform)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore --skip-dirs infra/.terraform infra/

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRoleV2
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} poc
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Security scan — image
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      - name: Push image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Delete previous migrate Job (immutable — must clear before re-running)
        run: kubectl delete job statuspage-migrate -n statuspage --ignore-not-found=true

      - name: Deploy
        run: |
          helm upgrade statuspage helm/statuspage \
            -n statuspage \
            --set image.tag=${{ github.sha }}

      - name: Wait for migration to complete
        run: kubectl wait --for=condition=complete job/statuspage-migrate -n statuspage --timeout=120s

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/statuspage-web -n statuspage --timeout=120s
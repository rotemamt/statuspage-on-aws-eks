<svg width="100%" viewBox="0 0 680 475" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Status-Page CI/CD delivery flow with GitOps</title>
<desc>A developer pushes to a Git repo, GitHub Actions runs lint, tests, build, security scans and pushes an image to ECR and a new tag to a manifests repo. Argo CD watches that repo and syncs the change to the EKS cluster, which pulls the image from ECR.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#444441}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
</defs>

<g class="c-gray"><rect x="40" y="40" width="130" height="54" rx="8"/><text class="th" x="105" y="63" text-anchor="middle">Developer</text><text class="ts" x="105" y="80" text-anchor="middle">git push</text></g>
<g class="c-gray"><rect x="235" y="40" width="170" height="54" rx="8"/><text class="th" x="320" y="63" text-anchor="middle">Git repo</text><text class="ts" x="320" y="80" text-anchor="middle">app + infra + Helm</text></g>

<rect x="450" y="32" width="185" height="192" rx="6" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="ts" x="463" y="50">GitHub Actions (CI)</text>
<g class="c-teal"><rect x="463" y="60" width="160" height="26" rx="4"/><text class="ts" x="543" y="77" text-anchor="middle">lint + unit tests</text></g>
<g class="c-teal"><rect x="463" y="92" width="160" height="26" rx="4"/><text class="ts" x="543" y="109" text-anchor="middle">build image</text></g>
<g class="c-teal"><rect x="463" y="124" width="160" height="26" rx="4"/><text class="ts" x="543" y="141" text-anchor="middle">Trivy image scan</text></g>
<g class="c-teal"><rect x="463" y="156" width="160" height="26" rx="4"/><text class="ts" x="543" y="173" text-anchor="middle">tfsec / checkov</text></g>
<g class="c-teal"><rect x="463" y="188" width="160" height="26" rx="4"/><text class="ts" x="543" y="205" text-anchor="middle">push to ECR</text></g>

<g class="c-coral"><rect x="450" y="258" width="185" height="52" rx="8"/><text class="th" x="542" y="280" text-anchor="middle">ECR</text><text class="ts" x="542" y="297" text-anchor="middle">image by digest</text></g>

<g class="c-gray"><rect x="230" y="256" width="175" height="56" rx="8"/><text class="th" x="317" y="280" text-anchor="middle">Manifests repo</text><text class="ts" x="317" y="297" text-anchor="middle">GitOps · Helm values</text></g>

<g class="c-purple"><rect x="40" y="370" width="160" height="56" rx="8"/><text class="th" x="120" y="394" text-anchor="middle">Argo CD</text><text class="ts" x="120" y="411" text-anchor="middle">watches manifests repo</text></g>
<g class="c-purple"><rect x="250" y="370" width="190" height="56" rx="8"/><text class="th" x="345" y="394" text-anchor="middle">EKS cluster</text><text class="ts" x="345" y="411" text-anchor="middle">runtime · pulls image</text></g>

<line class="arr" x1="170" y1="67" x2="233" y2="67" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="405" y1="67" x2="448" y2="70" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="543" y1="224" x2="543" y2="256" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="450" y1="196" x2="407" y2="270" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<text class="ts" x="392" y="236" text-anchor="end">commit new tag</text>
<line class="arr" x1="290" y1="312" x2="150" y2="368" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="200" y1="398" x2="248" y2="398" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="505" y1="312" x2="440" y2="392" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<text class="ts" x="500" y="360" text-anchor="end">pull image</text>

<g><rect x="40" y="450" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/><text class="ts" x="56" y="459">source (Git)</text>
<rect x="150" y="450" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/><text class="ts" x="166" y="459">CI (build + scan)</text>
<rect x="300" y="450" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/><text class="ts" x="316" y="459">registry</text>
<rect x="390" y="450" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/><text class="ts" x="406" y="459">CD + runtime</text></g>
</svg>

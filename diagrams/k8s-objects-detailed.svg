<svg width="100%" viewBox="0 0 680 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Status-Page detailed Kubernetes objects</title>
<desc>Every Kubernetes object in the statuspage namespace: web, rq worker and scheduler deployments, migrate Job and housekeeping CronJob, self-managed Redis, Service, Ingress, ConfigMap and Secret, ExternalSecret, ServiceAccount, HPA, PDB, NetworkPolicy, and cluster add-ons.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-amber rect{fill:#FAEEDA;stroke:#BA7517;stroke-width:.5}
.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#444441}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-amber .ts{fill:#854F0B}
</style>
</defs>

<g class="c-coral"><rect x="265" y="30" width="150" height="42" rx="6"/><text class="th" x="340" y="51" text-anchor="middle">ALB (from AWS)</text><text class="ts" x="340" y="65" text-anchor="middle">:443</text></g>

<rect x="30" y="90" width="620" height="470" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 3"/>
<text class="ts" x="42" y="108">namespace: statuspage</text>

<g class="c-teal"><rect x="255" y="120" width="170" height="40" rx="4"/><text class="th" x="340" y="140" text-anchor="middle">Ingress</text><text class="ts" x="340" y="154" text-anchor="middle">+ IngressClass (alb)</text></g>
<g class="c-teal"><rect x="255" y="180" width="170" height="40" rx="4"/><text class="th" x="340" y="200" text-anchor="middle">Service · web</text><text class="ts" x="340" y="214" text-anchor="middle">ClusterIP :80</text></g>

<g class="c-teal"><rect x="55" y="245" width="180" height="86" rx="4"/><text class="th" x="145" y="266" text-anchor="middle">Deployment · web</text><text class="ts" x="145" y="283" text-anchor="middle">nginx + gunicorn :8001</text><text class="ts" x="145" y="299" text-anchor="middle">many replicas</text><text class="ts" x="145" y="315" text-anchor="middle">liveness / readiness</text></g>
<g class="c-teal"><rect x="250" y="245" width="180" height="86" rx="4"/><text class="th" x="340" y="266" text-anchor="middle">Deployment · rq</text><text class="ts" x="340" y="283" text-anchor="middle">worker · runs jobs</text><text class="ts" x="340" y="299" text-anchor="middle">many replicas</text><text class="ts" x="340" y="315" text-anchor="middle">liveness / readiness</text></g>
<g class="c-teal"><rect x="445" y="245" width="180" height="86" rx="4"/><text class="th" x="535" y="266" text-anchor="middle">Deployment · scheduler</text><text class="ts" x="535" y="283" text-anchor="middle">the clock · enqueues</text><text class="ts" x="535" y="299" text-anchor="middle">replicas: 1</text><text class="ts" x="535" y="315" text-anchor="middle">liveness probe</text></g>

<g class="c-purple"><rect x="55" y="350" width="180" height="58" rx="4"/><text class="th" x="145" y="372" text-anchor="middle">StatefulSet · redis</text><text class="ts" x="145" y="389" text-anchor="middle">self-managed :6379</text><text class="ts" x="145" y="402" text-anchor="middle">PVC · DB0 tasks / DB1 cache</text></g>
<g class="c-teal"><rect x="250" y="350" width="180" height="58" rx="4"/><text class="th" x="340" y="372" text-anchor="middle">Job · migrate</text><text class="ts" x="340" y="389" text-anchor="middle">Helm pre-upgrade hook</text><text class="ts" x="340" y="402" text-anchor="middle">manage.py migrate</text></g>
<g class="c-teal"><rect x="445" y="350" width="180" height="58" rx="4"/><text class="th" x="535" y="372" text-anchor="middle">CronJob · housekeeping</text><text class="ts" x="535" y="389" text-anchor="middle">scheduled cleanup</text></g>

<rect x="45" y="426" width="590" height="76" rx="4" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="ts" x="55" y="442">config, secrets, identity, policies</text>
<g class="c-gray"><rect x="55" y="450" width="112" height="44" rx="4"/><text class="ts" x="111" y="470" text-anchor="middle">ConfigMap</text><text class="ts" x="111" y="484" text-anchor="middle">non-secret cfg</text></g>
<g class="c-gray"><rect x="177" y="450" width="112" height="44" rx="4"/><text class="ts" x="233" y="470" text-anchor="middle">Secret</text><text class="ts" x="233" y="484" text-anchor="middle">SECRET_KEY · DB pw</text></g>
<g class="c-gray"><rect x="299" y="450" width="112" height="44" rx="4"/><text class="ts" x="355" y="470" text-anchor="middle">ExternalSecret</text><text class="ts" x="355" y="484" text-anchor="middle">+ SecretStore</text></g>
<g class="c-gray"><rect x="421" y="450" width="100" height="44" rx="4"/><text class="ts" x="471" y="470" text-anchor="middle">ServiceAccount</text><text class="ts" x="471" y="484" text-anchor="middle">IRSA</text></g>
<g class="c-gray"><rect x="531" y="450" width="100" height="44" rx="4"/><text class="ts" x="581" y="464" text-anchor="middle">HPA · PDB</text><text class="ts" x="581" y="478" text-anchor="middle">NetworkPolicy</text><text class="ts" x="581" y="492" text-anchor="middle">LimitRange</text></g>

<text class="ts" x="42" y="524">Cluster add-ons (kube-system / argocd / monitoring)</text>
<g class="c-amber"><rect x="45" y="532" width="140" height="20" rx="4"/><text class="ts" x="115" y="546" text-anchor="middle">ALB Controller</text></g>
<g class="c-amber"><rect x="193" y="532" width="150" height="20" rx="4"/><text class="ts" x="268" y="546" text-anchor="middle">External Secrets Operator</text></g>
<g class="c-amber"><rect x="351" y="532" width="90" height="20" rx="4"/><text class="ts" x="396" y="546" text-anchor="middle">Argo CD</text></g>
<g class="c-amber"><rect x="449" y="532" width="182" height="20" rx="4"/><text class="ts" x="540" y="546" text-anchor="middle">Prometheus · Grafana · Alertmanager</text></g>

<g class="c-purple"><rect x="200" y="600" width="280" height="46" rx="6"/><text class="th" x="340" y="621" text-anchor="middle">RDS PostgreSQL (AWS)</text><text class="ts" x="340" y="636" text-anchor="middle">:5432 · outside cluster</text></g>

<line class="arr" x1="340" y1="72" x2="340" y2="118" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="340" y1="160" x2="340" y2="178" marker-end="url(#arrow)" stroke="#5F5E5A"/>

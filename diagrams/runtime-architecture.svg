<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Status-Page runtime architecture on AWS</title>
<desc>A user reaches an ALB in public subnets, which forwards to gunicorn web pods in an EKS cluster in private subnets. Web, rq worker and a single scheduler pod talk to RDS PostgreSQL and ElastiCache Redis, also in private subnets.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-gray .th,.c-gray .t{fill:#2C2C2A}.c-gray .ts{fill:#444441}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
</defs>

<g class="c-gray"><rect x="270" y="30" width="140" height="44" rx="8"/><text class="th" x="340" y="50" text-anchor="middle">User browser</text><text class="ts" x="340" y="66" text-anchor="middle">HTTPS :443</text></g>

<rect x="40" y="95" width="600" height="410" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="52" y="113">VPC 10.0.0.0/16 · 2 Availability Zones</text>

<rect x="60" y="125" width="560" height="72" rx="4" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="ts" x="72" y="142">Public subnets · Internet Gateway</text>
<g class="c-coral"><rect x="235" y="150" width="180" height="40" rx="4"/><text class="th" x="325" y="167" text-anchor="middle">ALB</text><text class="ts" x="325" y="182" text-anchor="middle">public entry · TLS (ACM)</text></g>
<g class="c-gray"><rect x="455" y="150" width="130" height="40" rx="4"/><text class="th" x="520" y="167" text-anchor="middle">NAT Gateway</text><text class="ts" x="520" y="182" text-anchor="middle">egress for private</text></g>

<rect x="60" y="220" width="560" height="145" rx="4" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="ts" x="72" y="238">Private subnets · EKS cluster (managed node groups)</text>
<g class="c-teal"><rect x="85" y="255" width="155" height="80" rx="4"/><text class="th" x="162" y="288" text-anchor="middle">Web · gunicorn</text><text class="ts" x="162" y="306" text-anchor="middle">serves pages + API</text><text class="ts" x="162" y="321" text-anchor="middle">many replicas · HPA</text></g>
<g class="c-teal"><rect x="262" y="255" width="155" height="80" rx="4"/><text class="th" x="339" y="288" text-anchor="middle">rq worker</text><text class="ts" x="339" y="306" text-anchor="middle">runs queued jobs</text><text class="ts" x="339" y="321" text-anchor="middle">many replicas</text></g>
<g class="c-teal"><rect x="440" y="255" width="155" height="80" rx="4"/><text class="th" x="517" y="288" text-anchor="middle">scheduler</text><text class="ts" x="517" y="306" text-anchor="middle">the clock · enqueues</text><text class="ts" x="517" y="321" text-anchor="middle">exactly 1 replica</text></g>

<rect x="60" y="385" width="560" height="95" rx="4" fill="none" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="ts" x="72" y="403">Private subnets · data (managed)</text>
<g class="c-purple"><rect x="110" y="413" width="210" height="52" rx="4"/><text class="th" x="215" y="435" text-anchor="middle">RDS PostgreSQL</text><text class="ts" x="215" y="452" text-anchor="middle">the truth · Multi-AZ · backups</text></g>
<g class="c-purple"><rect x="360" y="413" width="210" height="52" rx="4"/><text class="th" x="465" y="435" text-anchor="middle">ElastiCache Redis</text><text class="ts" x="465" y="452" text-anchor="middle">DB0 queue · DB1 cache</text></g>

<line class="arr" x1="340" y1="74" x2="325" y2="148" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="315" y1="192" x2="175" y2="253" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line class="arr" x1="155" y1="337" x2="195" y2="411" marker-end="url(#arrow)" stroke="#534AB7"/>
<line class="arr" x1="215" y1="337" x2="375" y2="411" marker-end="url(#arrow)" stroke="#534AB7"/>
<line class="arr" x1="320" y1="337" x2="285" y2="411" marker-end="url(#arrow)" stroke="#534AB7"/>
<line class="arr" x1="355" y1="337" x2="430" y2="411" marker-end="url(#arrow)" stroke="#534AB7"/>
<line class="arr" x1="517" y1="337" x2="500" y2="411" marker-end="url(#arrow)" stroke="#534AB7"/>

<g><rect x="60" y="518" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/><text class="ts" x="76" y="527">edge</text>
<rect x="130" y="518" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/><text class="ts" x="146" y="527">compute (EKS)</text>
<rect x="270" y="518" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/><text class="ts" x="286" y="527">data</text>
<rect x="330" y="518" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/><text class="ts" x="346" y="527">network</text></g>
</svg>

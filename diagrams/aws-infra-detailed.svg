<g class="c-purple"><rect x="360" y="442" width="210" height="52" rx="4"/><text class="th" x="465" y="464" text-anchor="middle">RDS standby (Multi-AZ)</text><text class="ts" x="465" y="481" text-anchor="middle">:5432 · AZ-b</text></g>


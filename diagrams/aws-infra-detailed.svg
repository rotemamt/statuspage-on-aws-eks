<g class="c-gray"><rect x="140" y="570" width="92" height="46" rx="4"/><text class="ts" x="186" y="591" text-anchor="middle">S3</text><text class="ts" x="186" y="606" text-anchor="middle">tf state</text></g>
<g class="c-gray"><rect x="240" y="570" width="92" height="46" rx="4"/><text class="ts" x="286" y="591" text-anchor="middle">DynamoDB</text><text class="ts" x="286" y="606" text-anchor="middle">tf lock</text></g>

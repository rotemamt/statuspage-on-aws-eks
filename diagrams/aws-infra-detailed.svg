<text class="ts" x="55" y="144">Public subnets · 2 AZ · sg: alb-sg</text>
<g class="c-coral"><rect x="205" y="156" width="230" height="44" rx="4"/><text class="th" x="320" y="176" text-anchor="middle">Application Load Balancer</text><text class="ts" x="320" y="191" text-anchor="middle">:443 / :80</text></g>
<g class="c-gray"><rect x="470" y="156" width="150" height="44" rx="4"/><text class="th" x="545" y="176" text-anchor="middle">NAT Gateway + EIP</text><text class="ts" x="545" y="191" text-anchor="middle">egress to internet</text></g>

<rect x="45" y="222" width="590" height="176" rx="4" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="3 3"/>

<g class="c-teal"><rect x="350" y="288" width="270" height="102" rx="4"/><text class="th" x="485" y="310" text-anchor="middle">EC2 node · AZ-b</text><text class="ts" x="485" y="328" text-anchor="middle">Managed Node Group</text><text class="ts" x="485" y="346" text-anchor="middle">pods: web · rq · scheduler · redis</text><text class="ts" x="485" y="364" text-anchor="middle">K8s objects in diagram 3</text></g>

<rect x="45" y="412" width="590" height="98" rx="4" fill="none" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 3"/>

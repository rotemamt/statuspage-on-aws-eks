<svg width="100%" viewBox="0 0 680 650" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Status-Page detailed AWS infrastructure</title>
<desc>Every provisioned AWS resource: VPC with public and private subnets across two AZs, Internet Gateway, NAT, ALB, EKS control plane and node group, RDS PostgreSQL primary and standby, and regional services ECR, S3, DynamoDB, Secrets Manager, CloudWatch and IAM.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#444441}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
</defs>

<g class="c-gray"><rect x="40" y="35" width="95" height="44" rx="6"/><text class="th" x="87" y="62" text-anchor="middle">User</text></g>
<g class="c-gray"><rect x="150" y="35" width="145" height="44" rx="6"/><text class="th" x="222" y="56" text-anchor="middle">Internet Gateway</text><text class="ts" x="222" y="71" text-anchor="middle">VPC edge</text></g>
<g class="c-coral"><rect x="340" y="35" width="120" height="44" rx="6"/><text class="th" x="400" y="62" text-anchor="middle">Route 53</text></g>
<g class="c-coral"><rect x="475" y="35" width="120" height="44" rx="6"/><text class="th" x="535" y="62" text-anchor="middle">ACM cert</text></g>

